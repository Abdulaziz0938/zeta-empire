<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- توهج النيون السماوي -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- تدرج لوني للخلفية -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e1d" />
      <stop offset="100%" stop-color="#02060d" />
    </linearGradient>

    <!-- تدرج الحرف الداخلي -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>
  </defs>

  <!-- خلفية داكنة بحواف دائرية -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- إطار النيون المتوهج -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#00f3ff" stroke-width="14" stroke-opacity="0.9" filter="url(#neon-glow)" />

  <!-- حرف Z المتناسق مع اسم المنصة ZETA -->
  <path d="M 160 170 L 352 170 L 190 342 L 352 342" fill="none" stroke="url(#cyan-grad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />
</svg>
